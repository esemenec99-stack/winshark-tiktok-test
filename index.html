<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winshark TikTok Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 60px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .tiktok-button {
            display: inline-block;
            background: #000;
            color: white;
            padding: 15px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .tiktok-button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Winshark TikTok Test</h1>

    <p>
        TikTok integration test website for Login Kit.
    </p>

    <a id="tiktok-login" class="tiktok-button" href="#">
        Увійти через TikTok
    </a>
</div>

<script>
    const clientKey = "awep22orb3ggsrju";

    const redirectUri =
        "https://esemenec99-stack.github.io/winshark-tiktok-test/";

    const state = "winshark_test";

    const loginUrl =
        "https://www.tiktok.com/v2/auth/authorize/" +
        "?client_key=" + encodeURIComponent(clientKey) +
        "&response_type=code" +
        "&scope=user.info.basic" +
        "&redirect_uri=" + encodeURIComponent(redirectUri) +
        "&state=" + encodeURIComponent(state);

    document.getElementById("tiktok-login").href = loginUrl;
</script>

</body>
</html>
